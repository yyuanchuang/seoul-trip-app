<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首爾花費記錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F3EEE4;
    --card:#FFFFFF;
    --ink:#1C1B1A;
    --ink-soft:#6B6560;
    --line:#E4DDCF;
    --good:#00A650;
    --warn:#FF7E00;
    --over:#C0392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC', sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:70px;
  }
  nav.topnav{
    display:flex; gap:0; background:var(--card); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  nav.topnav a{
    flex:1; text-align:center; padding:13px 0; font-size:13px; font-weight:700;
    text-decoration:none; color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  nav.topnav a.active{ color:var(--ink); border-bottom-color:var(--ink); }

  header{ padding:20px 20px 16px; }
  header .eyebrow{ font-size:12px; letter-spacing:0.14em; color:var(--ink-soft); font-weight:700; text-transform:uppercase; }
  header h1{ font-family:'Noto Serif TC', serif; font-weight:900; font-size:24px; margin:4px 0 2px; }

  .summary{
    margin:0 16px 18px; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; display:flex; justify-content:space-around; text-align:center;
  }
  .summary .stat .num{ font-family:'Noto Serif TC', serif; font-size:20px; font-weight:900; }
  .summary .stat .lbl{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .summary .stat.over .num{ color:var(--over); }
  .summary .stat.under .num{ color:var(--good); }

  .list{ padding:0 16px 100px; display:flex; flex-direction:column; gap:10px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; }

  .item{
    background:var(--card); border-radius:16px; padding:14px; border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(28,27,26,0.04); cursor:pointer;
  }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
  .item-top .name{ font-weight:700; font-size:15px; }
  .item-top .cat{
    font-size:11px; font-weight:700; color:var(--ink-soft); background:var(--paper);
    padding:2px 8px; border-radius:999px; flex:none;
  }
  .amounts{ display:flex; gap:14px; font-size:12.5px; margin-bottom:6px; }
  .amounts .budget{ color:var(--ink-soft); }
  .amounts .actual{ font-weight:700; }
  .amounts .actual.over{ color:var(--over); }
  .amounts .actual.under{ color:var(--good); }
  .item-meta{ display:flex; flex-wrap:wrap; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .item-meta span{ display:inline-flex; align-items:center; gap:3px; }

  .fab{
    position:fixed; right:20px; bottom:24px; z-index:150;
    width:56px; height:56px; border-radius:999px; border:none;
    background:var(--ink); color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(28,27,26,0.3); cursor:pointer;
  }

  .detail-overlay{
    position:fixed; inset:0; background:rgba(28,27,26,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:200;
  }
  .detail-sheet{
    background:var(--paper); border-radius:20px 20px 0 0;
    max-width:480px; width:100%; max-height:88vh; overflow-y:auto; padding:0 0 24px;
  }
  .detail-head{
    padding:20px 20px 12px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .detail-head h2{ font-family:'Noto Serif TC', serif; font-size:19px; font-weight:900; margin:0; }
  .detail-close{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    width:30px; height:30px; flex:none; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .detail-body{ padding:0 20px; }

  .form-group{ margin-bottom:14px; }
  .form-group label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  .form-group input, .form-group select, .form-group textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:14px; font-family:'Noto Sans TC', sans-serif; box-sizing:border-box; background:#fff; color:var(--ink);
  }
  .form-row{ display:flex; gap:10px; }
  .form-row .form-group{ flex:1; }
  .form-submit{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-top:4px;
  }
  .form-danger{
    width:100%; padding:10px; border-radius:12px; border:1px solid #EAD3CF;
    background:#FBF2F0; color:var(--over); font-weight:700; font-size:13px; cursor:pointer; margin-top:8px;
  }
  .mood-picker{ display:flex; gap:8px; }
  .mood-picker button{
    flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--line); background:#fff;
    font-size:20px; cursor:pointer;
  }
  .mood-picker button.selected{ background:var(--ink); border-color:var(--ink); }

  .loading{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; }
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html">投票</a>
  <a href="itinerary.html">行程</a>
  <a href="expenses.html" class="active">花費</a>
</nav>

<header>
  <div class="eyebrow">2026.10.21 – 10.25</div>
  <h1>首爾花費記錄</h1>
</header>

<div class="summary" id="summary"></div>
<div class="list" id="list"><div class="loading">載入中...</div></div>

<button class="fab" id="fabAdd">＋</button>
<div id="detailOverlay"></div>

<script>
const SUPABASE_URL = 'https://vmalwtagpcxvxocsopvi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYWx3dGFncGN4dnhvY3NvcHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4ODA1NTUsImV4cCI6MjEwMTQ1NjU1NX0.dXmudSH8rMmIYw3g0FgmcunBjsaAmyOULQLa9qWrR74';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = ['吃飯','咖啡','購物','交通','住宿','醫美','門票','其他'];
const MOODS = ['😍','😊','😐','😣','😱'];

let expenses = [];

function fmt(n){
  if (n === null || n === undefined || n === '') return null;
  return Number(n).toLocaleString('zh-Hant');
}

async function loadData(){
  const listEl = document.getElementById('list');
  try {
    const { data, error } = await sb.from('expenses').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    expenses = data || [];
    renderSummary();
    renderList();
  } catch (e) {
    console.error(e);
    listEl.innerHTML = `<div class="empty-state">載入失敗：${e.message || '請稍後再試'}</div>`;
  }
}

function renderSummary(){
  const el = document.getElementById('summary');
  const totalBudget = expenses.reduce((s, e) => s + (Number(e.budget_amount) || 0), 0);
  const totalActual = expenses.reduce((s, e) => s + (Number(e.actual_amount) || 0), 0);
  const diff = totalActual - totalBudget;
  const diffClass = diff > 0 ? 'over' : (diff < 0 ? 'under' : '');
  el.innerHTML = `
    <div class="stat">
      <div class="num">₩${fmt(totalBudget) ?? 0}</div>
      <div class="lbl">總預算</div>
    </div>
    <div class="stat ${diffClass}">
      <div class="num">₩${fmt(totalActual) ?? 0}</div>
      <div class="lbl">實際花費</div>
    </div>
    <div class="stat ${diffClass}">
      <div class="num">${diff > 0 ? '+' : ''}₩${fmt(diff)}</div>
      <div class="lbl">${diff > 0 ? '超支' : '結餘'}</div>
    </div>
  `;
}

function renderList(){
  const listEl = document.getElementById('list');
  if (!expenses.length){
    listEl.innerHTML = `<div class="empty-state">還沒有花費紀錄，點右下角「＋」新增</div>`;
    return;
  }
  listEl.innerHTML = '';
  expenses.forEach(e => {
    const budget = Number(e.budget_amount) || 0;
    const actual = e.actual_amount !== null ? Number(e.actual_amount) : null;
    const overUnder = actual !== null && budget > 0 ? (actual > budget ? 'over' : (actual < budget ? 'under' : '')) : '';
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <div class="item-top">
        <span class="name">${e.item}</span>
        ${e.category ? `<span class="cat">${e.category}</span>` : ''}
      </div>
      <div class="amounts">
        ${budget ? `<span class="budget">預算 ${e.currency || 'KRW'} ${fmt(budget)}</span>` : ''}
        ${actual !== null ? `<span class="actual ${overUnder}">實際 ${e.currency || 'KRW'} ${fmt(actual)}</span>` : `<span class="budget">尚未填實際</span>`}
      </div>
      <div class="item-meta">
        ${e.paid_by ? `<span>💳 ${e.paid_by} 付</span>` : ''}
        ${e.split_with ? `<span>👥 ${e.split_with}</span>` : ''}
        ${e.mood ? `<span>${e.mood}</span>` : ''}
      </div>
    `;
    row.addEventListener('click', () => openDetail(e));
    listEl.appendChild(row);
  });
}

function openDetail(e){
  const isNew = !e;
  const data = e || { item:'', category:CATEGORIES[0], budget_amount:'', actual_amount:'', currency:'KRW', paid_by:'', split_with:'', mood:'', photo_url:null };
  const overlay = document.getElementById('detailOverlay');
  const catOptions = CATEGORIES.map(c => `<option value="${c}" ${data.category===c?'selected':''}>${c}</option>`).join('');
  const moodBtns = MOODS.map(m => `<button type="button" class="mood-btn ${data.mood===m?'selected':''}" data-mood="${m}">${m}</button>`).join('');

  overlay.innerHTML = `
    <div class="detail-overlay">
      <div class="detail-sheet">
        <div class="detail-head">
          <h2>${isNew ? '新增花費' : '編輯花費'}</h2>
          <button class="detail-close" id="dClose">✕</button>
        </div>
        <div class="detail-body">
          <div class="form-group">
            <label>項目 *</label>
            <input id="f_item" type="text" placeholder="例如：午餐 一蘭拉麵" value="${data.item || ''}">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>分類</label>
              <select id="f_cat">${catOptions}</select>
            </div>
            <div class="form-group">
              <label>幣別</label>
              <input id="f_currency" type="text" value="${data.currency || 'KRW'}">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>預算金額</label>
              <input id="f_budget" type="number" placeholder="0" value="${data.budget_amount ?? ''}">
            </div>
            <div class="form-group">
              <label>實際金額</label>
              <input id="f_actual" type="number" placeholder="事後填" value="${data.actual_amount ?? ''}">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>付款人</label>
              <input id="f_paidby" type="text" placeholder="例如：媽媽" value="${data.paid_by || ''}">
            </div>
            <div class="form-group">
              <label>分攤方式</label>
              <input id="f_split" type="text" placeholder="例如：全家均分" value="${data.split_with || ''}">
            </div>
          </div>
          <div class="form-group">
            <label>當下心情</label>
            <div class="mood-picker">${moodBtns}</div>
          </div>
          <div class="form-error" id="f_error" style="display:none;color:#C0392B;font-size:12px;margin-bottom:10px;"></div>
          <button class="form-submit" id="f_save">${isNew ? '新增' : '儲存'}</button>
          ${!isNew ? `<button class="form-danger" id="f_delete">刪除這筆紀錄</button>` : ''}
        </div>
      </div>
    </div>
  `;

  let selectedMood = data.mood || '';
  overlay.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMood = (selectedMood === btn.dataset.mood) ? '' : btn.dataset.mood;
      overlay.querySelectorAll('.mood-btn').forEach(b => b.classList.toggle('selected', b.dataset.mood === selectedMood));
    });
  });

  overlay.querySelector('.detail-overlay').addEventListener('click', (ev) => {
    if (ev.target.classList.contains('detail-overlay')) closeDetail();
  });
  overlay.querySelector('#dClose').addEventListener('click', closeDetail);

  overlay.querySelector('#f_save').addEventListener('click', async () => {
    const item = document.getElementById('f_item').value.trim();
    const errBox = document.getElementById('f_error');
    if (!item){ errBox.textContent = '請至少填項目名稱'; errBox.style.display = 'block'; return; }
    const btn = document.getElementById('f_save');
    btn.disabled = true; btn.textContent = '處理中...';

    const payload = {
      item,
      category: document.getElementById('f_cat').value,
      currency: document.getElementById('f_currency').value.trim() || 'KRW',
      budget_amount: document.getElementById('f_budget').value ? Number(document.getElementById('f_budget').value) : null,
      actual_amount: document.getElementById('f_actual').value ? Number(document.getElementById('f_actual').value) : null,
      paid_by: document.getElementById('f_paidby').value.trim() || null,
      split_with: document.getElementById('f_split').value.trim() || null,
      mood: selectedMood || null,
    };

    try {
      let error;
      if (isNew){
        ({ error } = await sb.from('expenses').insert(payload));
      } else {
        ({ error } = await sb.from('expenses').update(payload).eq('id', e.id));
      }
      if (error) throw error;
      closeDetail();
      await loadData();
    } catch (err) {
      console.error(err);
      errBox.textContent = '儲存失敗，請再試一次';
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = isNew ? '新增' : '儲存';
    }
  });

  if (!isNew){
    overlay.querySelector('#f_delete').addEventListener('click', async () => {
      if (!confirm('確定要刪除這筆花費紀錄嗎？')) return;
      try {
        const { error } = await sb.from('expenses').delete().eq('id', e.id);
        if (error) throw error;
        closeDetail();
        await loadData();
      } catch (err) {
        console.error(err);
        alert('刪除失敗，請再試一次');
      }
    });
  }
}
function closeDetail(){ document.getElementById('detailOverlay').innerHTML = ''; }

document.getElementById('fabAdd').addEventListener('click', () => openDetail(null));

loadData();
</script>

</body>
</html>
