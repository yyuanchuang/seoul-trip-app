<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首爾花費記錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F3EEE4; --card:#FFFFFF; --ink:#1C1B1A; --ink-soft:#6B6560; --line:#E4DDCF;
    --l1:#0052A4; --l2:#00A650; --l3:#FF7E00; --plum:#A0498B; --alert:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:90px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}

  nav.topnav{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  nav.topnav a{flex:1;text-align:center;padding:13px 0;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ink-soft);border-bottom:2px solid transparent;}
  nav.topnav a.active{color:var(--ink);border-bottom-color:var(--ink);}
  nav.topnav a:focus-visible{outline:2px solid var(--l2);outline-offset:-2px;}

  .wrap{max-width:520px;margin:0 auto;}
  header{padding:22px 20px 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  header .eyebrow{font-size:11px;letter-spacing:0.18em;color:var(--ink-soft);font-weight:700;}
  header h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:25px;margin:6px 0 0;}
  .whoami{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}

  .totals{padding:16px 16px 0;display:flex;flex-direction:column;gap:10px;}
  .tot{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;}
  .tot .cur{font-size:11px;letter-spacing:0.12em;font-weight:700;color:var(--ink-soft);}
  .tot .grid{display:flex;justify-content:space-between;gap:10px;margin-top:8px;text-align:center;}
  .tot .cell{flex:1;}
  .tot .n{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:900;}
  .tot .l{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .tot .cell.over .n{color:var(--alert);}
  .tot .cell.under .n{color:var(--l2);}
  .cur-note{font-size:11.5px;color:var(--ink-soft);padding:8px 20px 0;line-height:1.7;}

  .settle{margin:16px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;}
  .settle h2{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:900;margin:0 0 4px;}
  .settle .sub{font-size:11.5px;color:var(--ink-soft);line-height:1.7;}
  .debt{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 0;}
  .debt + .debt{border-top:1px solid var(--line);}
  .debt .who{font-weight:700;}
  .debt .arrow{color:var(--ink-soft);}
  .debt .amt{margin-left:auto;font-family:'Noto Serif TC',serif;font-weight:900;font-size:15px;}
  .settle .clear{font-size:12.5px;color:var(--l2);font-weight:700;padding:8px 0 2px;}
  .settle .actions{display:flex;gap:8px;margin-top:12px;}
  .settle .actions button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);}
  .paidlog{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;}
  .paidlog .h{font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:0.08em;margin-bottom:6px;}
  .paidlog .r{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);padding:5px 0;cursor:pointer;}
  .paidlog .r .amt2{margin-left:auto;font-weight:700;color:var(--ink);}
  .paidlog .r:hover{color:var(--ink);}

  .list{padding:20px 16px 0;display:flex;flex-direction:column;gap:9px;}
  .day-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);padding:6px 4px 0;letter-spacing:0.04em;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;}
  .item:focus-visible{outline:2px solid var(--l2);outline-offset:2px;}
  .item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;}
  .item .nm{font-weight:700;font-size:14.5px;line-height:1.45;}
  .item .cat{font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);padding:2px 8px;border-radius:999px;flex:none;}
  .item .amt{display:flex;gap:12px;font-size:12.5px;margin-top:6px;align-items:baseline;}
  .item .amt .b{color:var(--ink-soft);}
  .item .amt .a{font-weight:700;}
  .item .amt .a.over{color:var(--alert);}
  .item .amt .a.under{color:var(--l2);}
  .item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .item .meta span{font-size:11px;color:var(--ink-soft);background:var(--paper);padding:2px 8px;border-radius:999px;}

  .fab{position:fixed;right:20px;bottom:24px;z-index:150;width:56px;height:56px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(28,27,26,.3);cursor:pointer;}

  .overlay{position:fixed;inset:0;background:rgba(28,27,26,.6);display:flex;align-items:flex-end;justify-content:center;z-index:200;}
  .sheet{background:var(--paper);border-radius:20px 20px 0 0;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:0 0 24px;}
  .sheet-head{padding:20px 20px 12px;display:flex;justify-content:space-between;gap:12px;}
  .sheet-head h3{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:900;margin:0;}
  .x{background:var(--card);border:1px solid var(--line);border-radius:999px;width:30px;height:30px;flex:none;font-size:15px;cursor:pointer;color:var(--ink-soft);}
  .sheet-body{padding:0 20px;}
  .fg{margin-bottom:13px;}
  .fg label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:'Noto Sans TC',sans-serif;background:#fff;color:var(--ink);}
  .frow{display:flex;gap:10px;}
  .frow .fg{flex:1;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .moods{display:flex;gap:8px;}
  .moods button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;}
  .moods button.on{background:var(--ink);border-color:var(--ink);}
  .save{width:100%;padding:12px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;}
  .del{width:100%;padding:10px;border-radius:12px;border:1px solid #EAD3CF;background:#FBF2F0;color:var(--alert);font-weight:700;font-size:13px;cursor:pointer;margin-top:8px;}
  .err{color:var(--alert);font-size:12px;margin-bottom:10px;display:none;}
  .state{text-align:center;padding:56px 20px;color:var(--ink-soft);font-size:13px;line-height:1.8;}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html">手冊</a>
  <a href="vote.html">投票</a>
  <a href="itinerary.html">行程</a>
  <a href="expenses.html" class="active">花費</a>

</nav>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">EXPENSES</div>
      <h1>花費記錄</h1>
    </div>
    <button class="whoami" id="whoami">我是…</button>
  </header>

  <div class="totals" id="totals"></div>
  <div class="cur-note" id="curNote"></div>
  <div id="settle"></div>
  <div class="list" id="list"><div class="state">載入中…</div></div>
</div>

<button class="fab" id="add" aria-label="新增花費">＋</button>
<div id="modal"></div>

<script>
const SUPABASE_URL='https://vmalwtagpcxvxocsopvi.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYWx3dGFncGN4dnhvY3NvcHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4ODA1NTUsImV4cCI6MjEwMTQ1NjU1NX0.dXmudSH8rMmIYw3g0FgmcunBjsaAmyOULQLa9qWrR74';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const CATS=['吃飯','咖啡','購物','交通','住宿','醫美','門票','其他'];
const MOODS=['😍','😊','😐','😣','😱'];

let rows=[], members=[], pays=[], me=localStorage.getItem('member_id')||'';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('zh-Hant',{maximumFractionDigits:0});
const mName=id=>{const m=members.find(x=>String(x.id)===String(id));return m?m.name:'';};

async function load(){
  try{
    const [mRes,eRes,sRes]=await Promise.all([
      sb.from('members').select('*').order('sort_order'),
      sb.from('expenses').select('*').order('created_at',{ascending:false}),
      sb.from('settlements').select('*').order('created_at',{ascending:false})
    ]);
    if(mRes.error) throw mRes.error;
    if(eRes.error) throw eRes.error;
    if(sRes.error) throw sRes.error;
    members=mRes.data||[]; rows=eRes.data||[]; pays=sRes.data||[];
    renderWho(); renderTotals(); renderSettle(); renderList();
  }catch(e){
    console.error(e);
    document.getElementById('list').innerHTML='<div class="state">讀不到花費資料，請稍後再試。</div>';
  }
}

function renderWho(){
  const b=document.getElementById('whoami');
  b.textContent = me ? ('我是 '+mName(me)) : '我是…';
}

function renderTotals(){
  const box=document.getElementById('totals');
  const curs=[...new Set(rows.map(r=>r.currency||'KRW'))].sort();
  if(!curs.length){box.innerHTML='';document.getElementById('curNote').textContent='';return;}
  box.innerHTML='';
  curs.forEach(cur=>{
    const rs=rows.filter(r=>(r.currency||'KRW')===cur);
    const b=rs.reduce((s,r)=>s+Number(r.budget_amount||0),0);
    const a=rs.reduce((s,r)=>s+Number(r.actual_amount||0),0);
    const d=a-b, cls=d>0?'over':(d<0?'under':'');
    const el=document.createElement('div');
    el.className='tot';
    el.innerHTML='<div class="cur">'+esc(cur)+'　'+rs.length+' 筆</div>'+
      '<div class="grid">'+
        '<div class="cell"><div class="n">'+fmt(b)+'</div><div class="l">預算</div></div>'+
        '<div class="cell '+cls+'"><div class="n">'+fmt(a)+'</div><div class="l">實際</div></div>'+
        '<div class="cell '+cls+'"><div class="n">'+(d>0?'+':'')+fmt(d)+'</div><div class="l">'+(d>0?'超支':'結餘')+'</div></div>'+
      '</div>';
    box.appendChild(el);
  });
  document.getElementById('curNote').textContent = curs.length>1
    ? '不同幣別分開統計，不換算。行前支出（機票等）與現地消費本來就該分開看。'
    : '';
}

function renderSettle(){
  const box=document.getElementById('settle');
  if(!members.length){box.innerHTML='';return;}

  const curs=[...new Set([...rows.map(r=>r.currency||'KRW'), ...pays.map(p=>p.currency||'TWD')])].sort();
  let html='';

  curs.forEach(cur=>{
    const bal={};
    members.forEach(m=>bal[m.id]=0);
    let counted=0;

    rows.filter(r=>(r.currency||'KRW')===cur).forEach(r=>{
      const amt=Number(r.actual_amount||0);
      if(!amt||!r.paid_by_id) return;
      const ids=(r.split_ids||'').split(',').map(x=>x.trim()).filter(Boolean);
      if(!ids.length) return;
      counted++;
      const share=amt/ids.length;
      if(bal[r.paid_by_id]!==undefined) bal[r.paid_by_id]+=amt;
      ids.forEach(id=>{ if(bal[id]!==undefined) bal[id]-=share; });
    });

    const myPays=pays.filter(p=>(p.currency||'TWD')===cur);
    myPays.forEach(p=>{
      const amt=Number(p.amount||0);
      if(!amt) return;
      counted++;
      if(bal[p.from_id]!==undefined) bal[p.from_id]+=amt;
      if(bal[p.to_id]!==undefined) bal[p.to_id]-=amt;
    });

    if(!counted) return;

    const C=members.filter(m=>bal[m.id]>0.5).map(m=>({id:m.id,name:m.name,v:bal[m.id]})).sort((a,b)=>b.v-a.v);
    const D=members.filter(m=>bal[m.id]<-0.5).map(m=>({id:m.id,name:m.name,v:-bal[m.id]})).sort((a,b)=>b.v-a.v);

    let lines='';
    let ci=0,di=0;
    while(ci<C.length&&di<D.length){
      const pay=Math.min(C[ci].v,D[di].v);
      lines+='<div class="debt" data-from="'+D[di].id+'" data-to="'+C[ci].id+'" data-amt="'+Math.round(pay)+'" data-cur="'+esc(cur)+'">'+
             '<span class="who">'+esc(D[di].name)+'</span><span class="arrow">&rarr;</span>'+
             '<span class="who">'+esc(C[ci].name)+'</span>'+
             '<span class="amt">'+esc(cur)+' '+fmt(Math.round(pay))+'</span></div>';
      C[ci].v-=pay; D[di].v-=pay;
      if(C[ci].v<0.5) ci++;
      if(D[di].v<0.5) di++;
    }
    if(!lines) lines='<div class="clear">'+esc(cur)+' 已經打平，不用互相給錢。</div>';

    let log='';
    if(myPays.length){
      log='<div class="paidlog"><div class="h">已還款紀錄</div>'+
        myPays.map(p=>'<div class="r" data-pay="'+p.id+'">'+esc(mName(p.from_id))+' &rarr; '+esc(mName(p.to_id))+
          (p.note?'　'+esc(p.note):'')+
          '<span class="amt2">'+esc(cur)+' '+fmt(p.amount)+'</span></div>').join('')+
        '</div>';
    }

    html+='<div class="settle" data-cur="'+esc(cur)+'"><h2>分帳結算 · '+esc(cur)+'</h2>'+
          '<div class="sub">支出與還款會自動抵銷，這裡顯示的是「還沒結清」的部分。</div>'+
          lines+
          '<div class="actions"><button class="rec" data-cur="'+esc(cur)+'">＋ 記錄一筆還款</button></div>'+
          log+
          '</div>';
  });

  box.innerHTML=html;

  box.querySelectorAll('.rec').forEach(b=>b.addEventListener('click',()=>openPay(null,b.dataset.cur)));
  box.querySelectorAll('.debt').forEach(d=>d.addEventListener('click',()=>{
    openPay(null,d.dataset.cur,{from_id:d.dataset.from,to_id:d.dataset.to,amount:d.dataset.amt});
  }));
  box.querySelectorAll('.paidlog .r').forEach(r=>r.addEventListener('click',()=>{
    const p=pays.find(x=>String(x.id)===String(r.dataset.pay));
    if(p) openPay(p);
  }));
}

/* ---- 還款 ---- */
function openPay(p, defCur, pre){
  const isNew=!p;
  const d=p||Object.assign({from_id:'',to_id:'',amount:'',currency:defCur||'TWD',paid_on:'',note:''}, pre||{});
  const opt=(sel)=>'<option value="">選擇</option>'+members.map(m=>'<option value="'+m.id+'"'+(String(sel)===String(m.id)?' selected':'')+'>'+esc(m.name)+'</option>').join('');

  document.getElementById('modal').innerHTML=
    '<div class="overlay"><div class="sheet">'+
      '<div class="sheet-head"><h3>'+(isNew?'記錄還款':'編輯還款')+'</h3><button class="x" id="mx">✕</button></div>'+
      '<div class="sheet-body">'+
        '<div class="err" style="display:block;color:var(--ink-soft);">誰把錢還給誰。這不是花費，只是把先前墊付的錢還清。</div>'+
        '<div class="frow">'+
          '<div class="fg"><label>誰付錢</label><select id="p_f">'+opt(d.from_id)+'</select></div>'+
          '<div class="fg"><label>給誰</label><select id="p_t">'+opt(d.to_id)+'</select></div>'+
        '</div>'+
        '<div class="frow">'+
          '<div class="fg"><label>金額 *</label><input id="p_a" type="number" inputmode="decimal" value="'+(d.amount??'')+'"></div>'+
          '<div class="fg"><label>幣別</label><input id="p_c" type="text" value="'+esc(d.currency||'TWD')+'"></div>'+
        '</div>'+
        '<div class="frow">'+
          '<div class="fg"><label>日期</label><input id="p_d" type="date" value="'+(d.paid_on||'')+'"></div>'+
          '<div class="fg"><label>備註</label><input id="p_n" type="text" placeholder="選填" value="'+esc(d.note||'')+'"></div>'+
        '</div>'+
        '<div class="err" id="p_e"></div>'+
        '<button class="save" id="p_s">'+(isNew?'記錄':'儲存')+'</button>'+
        (isNew?'':'<button class="del" id="p_del">刪除這筆還款</button>')+
      '</div>'+
    '</div></div>';

  const mo=document.getElementById('modal');
  mo.querySelector('.overlay').addEventListener('click',ev=>{if(ev.target.classList.contains('overlay'))close();});
  document.getElementById('mx').addEventListener('click',close);

  document.getElementById('p_s').addEventListener('click',async()=>{
    const err=document.getElementById('p_e');
    const f=document.getElementById('p_f').value, t=document.getElementById('p_t').value;
    const a=document.getElementById('p_a').value;
    if(!f||!t){err.textContent='請選擇付錢的人和收錢的人';err.style.display='block';return;}
    if(f===t){err.textContent='付錢和收錢不能是同一個人';err.style.display='block';return;}
    if(!a||Number(a)<=0){err.textContent='請填金額';err.style.display='block';return;}
    const btn=document.getElementById('p_s'); btn.disabled=true; btn.textContent='處理中…';
    const payload={from_id:Number(f),to_id:Number(t),amount:Number(a),
      currency:(document.getElementById('p_c').value.trim()||'TWD').toUpperCase(),
      paid_on:document.getElementById('p_d').value||null,
      note:document.getElementById('p_n').value.trim()||null};
    try{
      const res=isNew? await sb.from('settlements').insert(payload)
                     : await sb.from('settlements').update(payload).eq('id',p.id);
      if(res.error) throw res.error;
      close(); await load();
    }catch(e){
      console.error(e);
      err.textContent='存不起來，請再試一次'; err.style.display='block';
      btn.disabled=false; btn.textContent=isNew?'記錄':'儲存';
    }
  });

  if(!isNew){
    document.getElementById('p_del').addEventListener('click',async()=>{
      if(!confirm('確定刪除這筆還款紀錄？'))return;
      const {error}=await sb.from('settlements').delete().eq('id',p.id);
      if(error){console.error(error);alert('刪不掉，請再試一次');return;}
      close(); await load();
    });
  }
}

function renderList(){
  const box=document.getElementById('list');
  if(!rows.length){box.innerHTML='<div class="state">還沒有花費紀錄，點右下角「＋」新增。</div>';return;}
  box.innerHTML='';
  rows.forEach(r=>{
    const b=Number(r.budget_amount||0), hasA=r.actual_amount!==null&&r.actual_amount!==undefined&&r.actual_amount!=='';
    const a=hasA?Number(r.actual_amount):null;
    const cls=(a!==null&&b>0)?(a>b?'over':(a<b?'under':'')):'';
    const cur=r.currency||'KRW';
    const el=document.createElement('div');
    el.className='item'; el.tabIndex=0;
    let meta='';
    if(r.paid_by_id) meta+='<span>💳 '+esc(mName(r.paid_by_id))+' 付</span>';
    else if(r.paid_by) meta+='<span>💳 '+esc(r.paid_by)+'</span>';
    const ids=(r.split_ids||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(ids.length) meta+='<span>👥 '+ids.map(mName).filter(Boolean).join('、')+' 分</span>';
    else if(r.split_with) meta+='<span>👥 '+esc(r.split_with)+'</span>';
    if(r.spent_on) meta+='<span>📅 '+esc(r.spent_on)+'</span>';
    if(r.mood) meta+='<span>'+esc(r.mood)+'</span>';
    el.innerHTML='<div class="top"><span class="nm">'+esc(r.item)+'</span>'+(r.category?'<span class="cat">'+esc(r.category)+'</span>':'')+'</div>'+
      '<div class="amt">'+(b?'<span class="b">預算 '+esc(cur)+' '+fmt(b)+'</span>':'')+
      (a!==null?'<span class="a '+cls+'">實際 '+esc(cur)+' '+fmt(a)+'</span>':'<span class="b">尚未填實際</span>')+'</div>'+
      (meta?'<div class="meta">'+meta+'</div>':'');
    el.addEventListener('click',()=>open(r));
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter')open(r);});
    box.appendChild(el);
  });
}

/* ---- 我是誰 ---- */
function pickMe(){
  const chips=members.map(m=>'<button class="chip'+(String(me)===String(m.id)?' on':'')+'" data-id="'+m.id+'">'+esc(m.name)+'</button>').join('');
  document.getElementById('modal').innerHTML=
    '<div class="overlay"><div class="sheet">'+
      '<div class="sheet-head"><h3>你是哪一位？</h3><button class="x" id="mx">✕</button></div>'+
      '<div class="sheet-body">'+
        '<div class="fg"><label>選一次就好，這台裝置會記住</label><div class="chips" id="meChips">'+chips+'</div></div>'+
        '<div class="err" style="display:block;color:var(--ink-soft);">名稱之後可以改成真實姓名，改一次全站同步。</div>'+
      '</div>'+
    '</div></div>';
  const mo=document.getElementById('modal');
  mo.querySelector('.overlay').addEventListener('click',ev=>{if(ev.target.classList.contains('overlay'))close();});
  document.getElementById('mx').addEventListener('click',close);
  mo.querySelectorAll('#meChips .chip').forEach(c=>c.addEventListener('click',()=>{
    me=c.dataset.id; localStorage.setItem('member_id',me);
    renderWho(); close();
  }));
}

/* ---- 新增／編輯 ---- */
function open(r){
  const isNew=!r;
  const d=r||{item:'',category:CATS[0],currency:'KRW',budget_amount:'',actual_amount:'',
              paid_by_id:me||'',split_ids:members.map(m=>m.id).join(','),spent_on:'',mood:''};
  const catOpts=CATS.map(c=>'<option value="'+c+'"'+(d.category===c?' selected':'')+'>'+c+'</option>').join('');
  const payOpts='<option value="">未指定</option>'+members.map(m=>'<option value="'+m.id+'"'+(String(d.paid_by_id)===String(m.id)?' selected':'')+'>'+esc(m.name)+'</option>').join('');
  const sel=(d.split_ids||'').split(',').map(s=>s.trim()).filter(Boolean);
  const splitChips=members.map(m=>'<button type="button" class="chip'+(sel.includes(String(m.id))?' on':'')+'" data-id="'+m.id+'">'+esc(m.name)+'</button>').join('');
  const moodBtns=MOODS.map(x=>'<button type="button" class="mood'+(d.mood===x?' on':'')+'" data-m="'+x+'">'+x+'</button>').join('');

  document.getElementById('modal').innerHTML=
    '<div class="overlay"><div class="sheet">'+
      '<div class="sheet-head"><h3>'+(isNew?'新增花費':'編輯花費')+'</h3><button class="x" id="mx">✕</button></div>'+
      '<div class="sheet-body">'+
        '<div class="fg"><label>項目 *</label><input id="f_i" type="text" placeholder="例如：午餐 一蘭拉麵" value="'+esc(d.item)+'"></div>'+
        '<div class="frow">'+
          '<div class="fg"><label>分類</label><select id="f_c">'+catOpts+'</select></div>'+
          '<div class="fg"><label>幣別</label><input id="f_cur" type="text" value="'+esc(d.currency||'KRW')+'"></div>'+
        '</div>'+
        '<div class="frow">'+
          '<div class="fg"><label>預算</label><input id="f_b" type="number" inputmode="decimal" placeholder="0" value="'+(d.budget_amount??'')+'"></div>'+
          '<div class="fg"><label>實際</label><input id="f_a" type="number" inputmode="decimal" placeholder="事後填" value="'+(d.actual_amount??'')+'"></div>'+
        '</div>'+
        '<div class="frow">'+
          '<div class="fg"><label>誰付的</label><select id="f_p">'+payOpts+'</select></div>'+
          '<div class="fg"><label>日期</label><input id="f_d" type="date" value="'+(d.spent_on||'')+'"></div>'+
        '</div>'+
        '<div class="fg"><label>這筆誰要分（點選切換）</label><div class="chips" id="splitChips">'+splitChips+'</div></div>'+
        '<div class="fg"><label>當下心情</label><div class="moods" id="moodBox">'+moodBtns+'</div></div>'+
        '<div class="err" id="f_e"></div>'+
        '<button class="save" id="f_s">'+(isNew?'新增':'儲存')+'</button>'+
        (isNew?'':'<button class="del" id="f_del">刪除這筆</button>')+
      '</div>'+
    '</div></div>';

  const mo=document.getElementById('modal');
  let mood=d.mood||'';
  let split=sel.slice();

  mo.querySelector('.overlay').addEventListener('click',ev=>{if(ev.target.classList.contains('overlay'))close();});
  document.getElementById('mx').addEventListener('click',close);
  mo.querySelectorAll('#splitChips .chip').forEach(c=>c.addEventListener('click',()=>{
    const id=c.dataset.id;
    if(split.includes(id)) split=split.filter(x=>x!==id); else split.push(id);
    c.classList.toggle('on');
  }));
  mo.querySelectorAll('#moodBox .mood').forEach(b=>b.addEventListener('click',()=>{
    mood = mood===b.dataset.m ? '' : b.dataset.m;
    mo.querySelectorAll('#moodBox .mood').forEach(x=>x.classList.toggle('on',x.dataset.m===mood));
  }));

  document.getElementById('f_s').addEventListener('click',async()=>{
    const item=document.getElementById('f_i').value.trim();
    const err=document.getElementById('f_e');
    if(!item){err.textContent='請填項目名稱';err.style.display='block';return;}
    const btn=document.getElementById('f_s'); btn.disabled=true; btn.textContent='處理中…';
    const pid=document.getElementById('f_p').value;
    const payload={
      item,
      category:document.getElementById('f_c').value,
      currency:(document.getElementById('f_cur').value.trim()||'KRW').toUpperCase(),
      budget_amount:document.getElementById('f_b').value!==''?Number(document.getElementById('f_b').value):null,
      actual_amount:document.getElementById('f_a').value!==''?Number(document.getElementById('f_a').value):null,
      paid_by_id:pid?Number(pid):null,
      paid_by:pid?mName(pid):null,
      split_ids:split.join(','),
      split_with:split.map(mName).filter(Boolean).join('、'),
      spent_on:document.getElementById('f_d').value||null,
      mood:mood||null
    };
    try{
      const res=isNew? await sb.from('expenses').insert(payload)
                     : await sb.from('expenses').update(payload).eq('id',r.id);
      if(res.error) throw res.error;
      close(); await load();
    }catch(e){
      console.error(e);
      err.textContent='存不起來，請再試一次'; err.style.display='block';
      btn.disabled=false; btn.textContent=isNew?'新增':'儲存';
    }
  });

  if(!isNew){
    document.getElementById('f_del').addEventListener('click',async()=>{
      if(!confirm('確定刪除這筆花費？'))return;
      const {error}=await sb.from('expenses').delete().eq('id',r.id);
      if(error){console.error(error);alert('刪不掉，請再試一次');return;}
      close(); await load();
    });
  }
}
function close(){document.getElementById('modal').innerHTML='';}

document.getElementById('add').addEventListener('click',()=>open(null));
document.getElementById('whoami').addEventListener('click',pickMe);
load();
</script>
