<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首爾行程投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F3EEE4;
    --card:#FFFFFF;
    --ink:#1C1B1A;
    --ink-soft:#6B6560;
    --line:#E4DDCF;

    --coffee:#00A650;
    --food:#FF7E00;
    --shop:#00A5DE;
    --sight:#0052A4;
    --med:#A0498B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 20px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
    border-bottom:1px solid var(--line);
  }
  header .row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    font-weight:700;
    text-transform:uppercase;
  }
  header h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:26px;
    margin:4px 0 2px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .whoami{
    font-size:12px;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--line);
    padding:6px 10px;
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
  }

  .section{ padding:24px 16px 4px; }
  .section-head{
    display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:0 4px;
    cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .badge{
    width:30px; height:30px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:13px;
    font-family:'Noto Serif TC', serif; flex:none;
  }
  .section-head h2{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:17px; margin:0; }
  .section-head .count{ font-size:12px; color:var(--ink-soft); }
  .section-head .chevron{
    margin-left:auto; width:18px; height:18px; flex:none;
    transition:transform 0.2s ease; color:var(--ink-soft);
  }
  .section-head .chevron.open{ transform:rotate(180deg); }

  .cards{
    display:flex; flex-direction:column; gap:10px;
    overflow:hidden;
    max-height:0;
    transition:max-height 0.25s ease;
  }
  .cards.open{ max-height:4000px; }
  .card{
    background:var(--card); border-radius:16px; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 1px 2px rgba(28,27,26,0.04); border:1px solid var(--line);
  }
  .card .stripe{ width:4px; align-self:stretch; border-radius:4px; flex:none; }
  .card-body{ flex:1; min-width:0; }
  .card-body .name{ font-weight:700; font-size:15px; margin:0 0 2px; }
  .card-body .intro{ font-size:12.5px; color:var(--ink-soft); margin:0 0 6px; line-height:1.4; }
  .tag{
    display:inline-flex; align-items:center; font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:999px; color:#fff;
  }
  .tag.empty{ background:var(--line); color:var(--ink-soft); }

  .like-btn{
    flex:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; cursor:pointer; padding:6px 4px;
    -webkit-tap-highlight-color:transparent;
  }
  .like-btn svg{ width:22px; height:22px; transition:transform 0.15s ease; }
  .like-btn.liked svg{ transform:scale(1.12); }
  .like-btn .count{ font-size:11px; font-weight:700; color:var(--ink-soft); }
  .like-btn.liked .count{ color:var(--ink); }
  .like-btn:disabled{ opacity:0.4; }

  footer{ text-align:center; font-size:11px; color:var(--ink-soft); padding:28px 20px 0; }

  .overlay{
    position:fixed; inset:0; background:rgba(28,27,26,0.55);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay .box{
    background:var(--card); border-radius:20px; padding:24px; max-width:320px; width:100%;
  }
  .overlay h3{ font-family:'Noto Serif TC', serif; margin:0 0 6px; font-size:18px; }
  .overlay p{ font-size:13px; color:var(--ink-soft); margin:0 0 16px; }
  .overlay input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:14px; margin-bottom:12px; box-sizing:border-box;
  }
  .overlay button{
    width:100%; padding:10px; border-radius:10px; border:none;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
  }

  .loading, .error{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px;
  }
</style>
</head>
<body>

<header>
  <div class="row">
    <div>
      <div class="eyebrow">2026.10.21 – 10.25</div>
      <h1>首爾行程投票</h1>
      <p>點愛心投給你想去的地方</p>
    </div>
    <div class="whoami" id="whoami">...</div>
  </div>
</header>

<div id="app"><div class="loading">載入中...</div></div>

<footer>投票即時同步給全家人 · 資料存於雲端資料庫</footer>

<div id="nameOverlay" class="overlay" style="display:none;">
  <div class="box">
    <h3>你是誰？</h3>
    <p>輸入你的名字，之後投票會記得是你按的</p>
    <input id="nameInput" type="text" placeholder="例如：媽媽 / 阿翔" maxlength="10">
    <button id="nameSubmit">開始投票</button>
  </div>
</div>

<script>
// ====== 設定：接你的 Supabase ======
const SUPABASE_URL = 'https://vmalwtagpcxvxocsopvi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYWx3dGFncGN4dnhvY3NvcHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4ODA1NTUsImV4cCI6MjEwMTQ1NjU1NX0.dXmudSH8rMmIYw3g0FgmcunBjsaAmyOULQLa9qWrR74';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORY_META = {
  '咖啡': { color: 'var(--coffee)', label: '咖啡' },
  '美食': { color: 'var(--food)', label: '美食' },
  '購物': { color: 'var(--shop)', label: '購物' },
  '景點': { color: 'var(--sight)', label: '景點' },
  '醫美': { color: 'var(--med)', label: '醫美' },
};
// 資料庫裡原始分類 → 顯示分類
const CATEGORY_ALIAS = {
  '咖啡':'咖啡', '聖水洞':'美食', '弘大美食':'美食',
  '購物':'購物', '景點':'景點', '醫美':'醫美'
};
const CATEGORY_ORDER = ['咖啡','美食','購物','景點','醫美'];

let voterName = localStorage.getItem('voter_name') || '';
let places = [];
let votes = [];
let openCategories = new Set(); // 記住哪些分類是展開的

function heartPath(){
  return 'M12 21s-6.5-4.35-9.3-8.28C.6 9.9 1.4 6.4 4.4 5.1c2-.86 4.1-.2 5.4 1.4C11 4.9 13.1 4.24 15.1 5.1c3 1.3 3.8 4.8 1.7 7.62C18.5 16.65 12 21 12 21z';
}

async function loadData(){
  const app = document.getElementById('app');
  try {
    const [{ data: placesData, error: pErr }, { data: votesData, error: vErr }] = await Promise.all([
      sb.from('places').select('*'),
      sb.from('votes').select('*'),
    ]);
    if (pErr) throw pErr;
    if (vErr) throw vErr;
    places = placesData || [];
    votes = votesData || [];
    render();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="error">資料載入失敗，請檢查網路連線或稍後再試。<br><small>${e.message || ''}</small></div>`;
  }
}

function countFor(placeId){
  return votes.filter(v => v.place_id === placeId).length;
}
function hasVoted(placeId){
  return votes.some(v => v.place_id === placeId && v.voter_name === voterName);
}

async function toggleVote(placeId, btn){
  btn.disabled = true;
  const already = hasVoted(placeId);
  try {
    if (already) {
      const { error } = await sb.from('votes').delete()
        .eq('place_id', placeId).eq('voter_name', voterName);
      if (error) throw error;
    } else {
      const { error } = await sb.from('votes').insert({ place_id: placeId, voter_name: voterName });
      if (error) throw error;
    }
    await loadData();
  } catch (e) {
    console.error(e);
    alert('投票失敗，請再試一次');
    btn.disabled = false;
  }
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  CATEGORY_ORDER.forEach(cat => {
    const meta = CATEGORY_META[cat];
    const items = places.filter(p => (CATEGORY_ALIAS[p.分類] || p.分類) === cat);
    if(!items.length) return;

    const isOpen = openCategories.has(cat);

    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `
      <div class="section-head">
        <div class="badge" style="background:${meta.color}">${meta.label[0]}</div>
        <h2>${meta.label}</h2>
        <span class="count">${items.length} 個地點</span>
        <svg class="chevron ${isOpen ? 'open' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>
      <div class="cards ${isOpen ? 'open' : ''}"></div>
    `;
    const cardsWrap = section.querySelector('.cards');
    const head = section.querySelector('.section-head');
    head.addEventListener('click', () => {
      if (openCategories.has(cat)) openCategories.delete(cat);
      else openCategories.add(cat);
      render();
    });

    items.forEach(p => {
      const liked = hasVoted(p.id);
      const count = countFor(p.id);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="stripe" style="background:${meta.color}"></div>
        <div class="card-body">
          <p class="name">${p.名稱 || ''}</p>
          ${p.介紹 ? `<p class="intro">${p.介紹}</p>` : ''}
          ${p.地區
            ? `<span class="tag" style="background:${meta.color}">${p.地區}</span>`
            : `<span class="tag empty">地區待補</span>`}
        </div>
        <button class="like-btn ${liked ? 'liked' : ''}">
          <svg viewBox="0 0 24 24" fill="${liked ? meta.color : 'none'}" stroke="${liked ? meta.color : 'var(--ink-soft)'}" stroke-width="1.6">
            <path d="${heartPath()}"/>
          </svg>
          <span class="count">${count}</span>
        </button>
      `;
      card.querySelector('.like-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleVote(p.id, e.currentTarget);
      });
      cardsWrap.appendChild(card);
    });

    app.appendChild(section);
  });
}

function showNameOverlay(){
  document.getElementById('nameOverlay').style.display = 'flex';
  document.getElementById('nameInput').focus();
}
function updateWhoami(){
  document.getElementById('whoami').textContent = voterName ? `👤 ${voterName}` : '設定名字';
}

document.getElementById('nameSubmit').addEventListener('click', () => {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) return;
  voterName = val;
  localStorage.setItem('voter_name', voterName);
  document.getElementById('nameOverlay').style.display = 'none';
  updateWhoami();
  render();
});
document.getElementById('whoami').addEventListener('click', showNameOverlay);

// 啟動
updateWhoami();
if (!voterName) showNameOverlay();
loadData();
</script>

</body>
</html>
