<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首爾行程投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F3EEE4;
    --card:#FFFFFF;
    --ink:#1C1B1A;
    --ink-soft:#6B6560;
    --line:#E4DDCF;

    --coffee:#00A650;
    --food:#FF7E00;
    --shop:#00A5DE;
    --sight:#0052A4;
    --med:#A0498B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  nav.topnav{
    display:flex; gap:0; background:var(--card); border-bottom:1px solid var(--line);
  }
  nav.topnav a{
    flex:1; text-align:center; padding:13px 0; font-size:13px; font-weight:700;
    text-decoration:none; color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  nav.topnav a.active{ color:var(--ink); border-bottom-color:var(--ink); }
  header{
    padding:28px 20px 20px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
    border-bottom:1px solid var(--line);
  }  header .row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    font-weight:700;
    text-transform:uppercase;
  }
  header h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:26px;
    margin:4px 0 2px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .whoami{
    font-size:12px;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--line);
    padding:6px 10px;
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
  }

  .section{ padding:24px 16px 4px; }
  .section-head{
    display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:0 4px;
    cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .badge{
    width:30px; height:30px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:13px;
    font-family:'Noto Serif TC', serif; flex:none;
  }
  .section-head h2{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:17px; margin:0; }
  .section-head .count{ font-size:12px; color:var(--ink-soft); }
  .section-head .chevron{
    margin-left:auto; width:18px; height:18px; flex:none;
    transition:transform 0.2s ease; color:var(--ink-soft);
  }
  .section-head .chevron.open{ transform:rotate(180deg); }

  .cards{
    display:flex; flex-direction:column; gap:10px;
    overflow:hidden;
    max-height:0;
    transition:max-height 0.25s ease;
  }
  .cards.open{ max-height:4000px; }
  .card{
    background:var(--card); border-radius:16px; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 1px 2px rgba(28,27,26,0.04); border:1px solid var(--line);
  }
  .card .stripe{ width:4px; align-self:stretch; border-radius:4px; flex:none; }
  .card-body{ flex:1; min-width:0; }
  .card-body .name{ font-weight:700; font-size:15px; margin:0 0 2px; }
  .card-body .intro{ font-size:12.5px; color:var(--ink-soft); margin:0 0 6px; line-height:1.4; }
  .tag{
    display:inline-flex; align-items:center; font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:999px; color:#fff;
  }
  .tag.empty{ background:var(--line); color:var(--ink-soft); }

  .like-btn{
    flex:none; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; cursor:pointer; padding:6px 4px;
    -webkit-tap-highlight-color:transparent;
  }
  .like-btn svg{ width:22px; height:22px; transition:transform 0.15s ease; }
  .like-btn.liked svg{ transform:scale(1.12); }
  .like-btn .count{ font-size:11px; font-weight:700; color:var(--ink-soft); }
  .like-btn.liked .count{ color:var(--ink); }
  .like-btn:disabled{ opacity:0.4; }

  footer{ text-align:center; font-size:11px; color:var(--ink-soft); padding:28px 20px 0; }

  .overlay{
    position:fixed; inset:0; background:rgba(28,27,26,0.55);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .overlay .box{
    background:var(--card); border-radius:20px; padding:24px; max-width:320px; width:100%;
  }
  .overlay h3{ font-family:'Noto Serif TC', serif; margin:0 0 6px; font-size:18px; }
  .overlay p{ font-size:13px; color:var(--ink-soft); margin:0 0 16px; }
  .overlay input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:14px; margin-bottom:12px; box-sizing:border-box;
  }
  .overlay button{
    width:100%; padding:10px; border-radius:10px; border:none;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
  }

  .loading, .error{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px;
  }

  .card{ cursor:pointer; }

  .detail-overlay{
    position:fixed; inset:0; background:rgba(28,27,26,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:200;
  }
  .detail-sheet{
    background:var(--paper); border-radius:20px 20px 0 0;
    max-width:480px; width:100%; max-height:85vh; overflow-y:auto;
    padding:0 0 24px;
  }
  .detail-top{
    height:6px; border-radius:20px 20px 0 0;
  }
  .detail-head{
    padding:20px 20px 12px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .detail-head h2{
    font-family:'Noto Serif TC', serif; font-size:21px; font-weight:900; margin:0 0 6px;
  }
  .detail-close{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    width:30px; height:30px; flex:none; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .detail-body{ padding:0 20px; }
  .detail-body .intro{ font-size:14px; line-height:1.7; color:var(--ink); margin:0 0 16px; }
  .detail-meta{
    display:flex; flex-direction:column; gap:8px; margin-bottom:18px;
  }
  .detail-meta .row{
    display:flex; gap:8px; font-size:13px; color:var(--ink-soft);
  }
  .detail-meta .row b{ color:var(--ink); font-weight:700; min-width:56px; flex:none; }
  .detail-actions{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;
  }
  .detail-actions a, .detail-actions button{
    flex:1; min-width:120px; text-align:center;
    padding:10px 12px; border-radius:12px; font-size:13px; font-weight:700;
    text-decoration:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
    cursor:pointer;
  }
  .detail-like{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px; border-radius:12px; border:none; width:100%;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .detail-like svg{ width:20px; height:20px; }

  .fab{
    position:fixed; right:20px; bottom:24px; z-index:150;
    width:56px; height:56px; border-radius:999px; border:none;
    background:var(--ink); color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(28,27,26,0.3); cursor:pointer;
  }

  .form-group{ margin-bottom:14px; }
  .form-group label{
    display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;
  }
  .form-group input, .form-group select, .form-group textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:14px; font-family:'Noto Sans TC', sans-serif; box-sizing:border-box; background:#fff; color:var(--ink);
  }
  .form-group textarea{ resize:vertical; min-height:60px; }
  .form-submit{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-top:4px;
  }
  .form-submit:disabled{ opacity:0.5; }
  .form-error{ color:#C0392B; font-size:12px; margin:-6px 0 10px; }
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html">手冊</a>
  <a href="vote.html" class="active">投票</a>
  <a href="itinerary.html">行程</a>
  <a href="expenses.html">花費</a>
</nav>

<header>
  <div class="row">
    <div>
      <div class="eyebrow">2026.10.21 – 10.25</div>
      <h1>首爾行程投票</h1>
      <p>點愛心投給你想去的地方</p>
    </div>
    <div class="whoami" id="whoami">...</div>
  </div>
</header>

<div id="app"><div class="loading">載入中...</div></div>

<footer>投票即時同步給全家人 · 資料存於雲端資料庫</footer>

<div id="nameOverlay" class="overlay" style="display:none;">
  <div class="box">
    <h3>你是誰？</h3>
    <p>輸入你的名字，之後投票會記得是你按的</p>
    <input id="nameInput" type="text" placeholder="例如：媽媽 / 阿翔" maxlength="10">
    <button id="nameSubmit">開始投票</button>
  </div>
</div>

<div id="detailOverlay"></div>
<div id="addOverlay"></div>
<button class="fab" id="fabAdd">＋</button>

<script>
// ====== 設定：接你的 Supabase ======
const SUPABASE_URL = 'https://vmalwtagpcxvxocsopvi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYWx3dGFncGN4dnhvY3NvcHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4ODA1NTUsImV4cCI6MjEwMTQ1NjU1NX0.dXmudSH8rMmIYw3g0FgmcunBjsaAmyOULQLa9qWrR74';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORY_META = {
  '咖啡': { color: 'var(--coffee)', label: '咖啡' },
  '美食': { color: 'var(--food)', label: '美食' },
  '購物': { color: 'var(--shop)', label: '購物' },
  '景點': { color: 'var(--sight)', label: '景點' },
  '醫美': { color: 'var(--med)', label: '醫美' },
};
// 資料庫裡原始分類 → 顯示分類
const CATEGORY_ALIAS = {
  '咖啡':'咖啡', '聖水洞':'美食', '弘大美食':'美食',
  '購物':'購物', '景點':'景點', '醫美':'醫美'
};
const CATEGORY_ORDER = ['咖啡','美食','購物','景點','醫美'];

let voterName = localStorage.getItem('voter_name') || '';
let places = [];
let votes = [];
let openCategories = new Set(); // 記住哪些分類是展開的

function heartPath(){
  return 'M12 21s-6.5-4.35-9.3-8.28C.6 9.9 1.4 6.4 4.4 5.1c2-.86 4.1-.2 5.4 1.4C11 4.9 13.1 4.24 15.1 5.1c3 1.3 3.8 4.8 1.7 7.62C18.5 16.65 12 21 12 21z';
}

async function loadData(){
  const app = document.getElementById('app');
  try {
    const [{ data: placesData, error: pErr }, { data: votesData, error: vErr }] = await Promise.all([
      sb.from('places').select('*'),
      sb.from('votes').select('*'),
    ]);
    if (pErr) throw pErr;
    if (vErr) throw vErr;
    places = placesData || [];
    votes = votesData || [];
    render();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="error">資料載入失敗，請檢查網路連線或稍後再試。<br><small>${e.message || ''}</small></div>`;
  }
}

function countFor(placeId){
  return votes.filter(v => v.place_id === placeId).length;
}
function hasVoted(placeId){
  return votes.some(v => v.place_id === placeId && v.voter_name === voterName);
}

async function toggleVote(placeId, btn){
  btn.disabled = true;
  const already = hasVoted(placeId);
  try {
    if (already) {
      const { error } = await sb.from('votes').delete()
        .eq('place_id', placeId).eq('voter_name', voterName);
      if (error) throw error;
    } else {
      const { error } = await sb.from('votes').insert({ place_id: placeId, voter_name: voterName });
      if (error) throw error;
    }
    await loadData();
  } catch (e) {
    console.error(e);
    alert('投票失敗，請再試一次');
    btn.disabled = false;
  }
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  CATEGORY_ORDER.forEach(cat => {
    const meta = CATEGORY_META[cat];
    const items = places.filter(p => (CATEGORY_ALIAS[p.分類] || p.分類) === cat);
    if(!items.length) return;

    const isOpen = openCategories.has(cat);

    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `
      <div class="section-head">
        <div class="badge" style="background:${meta.color}">${meta.label[0]}</div>
        <h2>${meta.label}</h2>
        <span class="count">${items.length} 個地點</span>
        <svg class="chevron ${isOpen ? 'open' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>
      <div class="cards ${isOpen ? 'open' : ''}"></div>
    `;
    const cardsWrap = section.querySelector('.cards');
    const head = section.querySelector('.section-head');
    head.addEventListener('click', () => {
      if (openCategories.has(cat)) openCategories.delete(cat);
      else openCategories.add(cat);
      render();
    });

    items.forEach(p => {
      const liked = hasVoted(p.id);
      const count = countFor(p.id);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="stripe" style="background:${meta.color}"></div>
        <div class="card-body">
          <p class="name">${p.名稱 || ''}</p>
          ${p.介紹 ? `<p class="intro">${p.介紹}</p>` : ''}
          ${p.地區
            ? `<span class="tag" style="background:${meta.color}">${p.地區}</span>`
            : `<span class="tag empty">地區待補</span>`}
        </div>
        <button class="like-btn ${liked ? 'liked' : ''}">
          <svg viewBox="0 0 24 24" fill="${liked ? meta.color : 'none'}" stroke="${liked ? meta.color : 'var(--ink-soft)'}" stroke-width="1.6">
            <path d="${heartPath()}"/>
          </svg>
          <span class="count">${count}</span>
        </button>
      `;
      card.querySelector('.like-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleVote(p.id, e.currentTarget);
      });
      card.addEventListener('click', () => openDetail(p, meta));
      cardsWrap.appendChild(card);
    });

    app.appendChild(section);
  });
}

function mapSearchQuery(p){
  return encodeURIComponent(`${p.名稱 || ''} ${p.地址 || ''}`.trim());
}

function openDetail(p, meta){
  const liked = hasVoted(p.id);
  const count = countFor(p.id);
  const q = mapSearchQuery(p);

  const rows = [];
  if (p.地區) rows.push(`<div class="row"><b>地區</b><span>${p.地區}</span></div>`);
  if (p.地址) rows.push(`<div class="row"><b>地址</b><span>${p.地址}</span></div>`);
  if (p.營業時間) rows.push(`<div class="row"><b>營業時間</b><span>${p.營業時間}</span></div>`);
  if (p.加入者) rows.push(`<div class="row"><b>誰找的</b><span>${p.加入者}</span></div>`);
  if (p.備註) rows.push(`<div class="row"><b>備註</b><span>${p.備註}</span></div>`);

  const overlay = document.getElementById('detailOverlay');
  overlay.innerHTML = `
    <div class="detail-overlay">
      <div class="detail-sheet">
        <div class="detail-top" style="background:${meta.color}"></div>
        <div class="detail-head">
          <div>
            <span class="tag" style="background:${meta.color}">${meta.label}</span>
            <h2>${p.名稱 || ''}</h2>
          </div>
          <button class="detail-close">✕</button>
        </div>
        <div class="detail-body">
          ${p.介紹 ? `<p class="intro">${p.介紹}</p>` : ''}
          <div class="detail-meta">${rows.join('')}</div>
          <div class="detail-actions">
            ${p.來源連結 ? `<a href="${p.來源連結}" target="_blank" rel="noopener">📷 看貼文</a>` : ''}
            <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">🗺️ Google 地圖</a>
            <a href="https://map.naver.com/v5/search/${q}" target="_blank" rel="noopener">🗺️ Naver 地圖</a>
          </div>
          <button class="detail-like" id="detailLikeBtn">
            <svg viewBox="0 0 24 24" fill="${liked ? meta.color : 'none'}" stroke="${liked ? meta.color : 'var(--ink-soft)'}" stroke-width="1.6">
              <path d="${heartPath()}"/>
            </svg>
            <span>${liked ? '已投票' : '投給這裡'}（${count}）</span>
          </button>
        </div>
      </div>
    </div>
  `;
  overlay.querySelector('.detail-overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('detail-overlay')) closeDetail();
  });
  overlay.querySelector('.detail-close').addEventListener('click', closeDetail);
  overlay.querySelector('#detailLikeBtn').addEventListener('click', async (e) => {
    await toggleVote(p.id, e.currentTarget);
    const freshPlace = places.find(x => x.id === p.id) || p;
    openDetail(freshPlace, meta);
  });
}

function closeDetail(){
  document.getElementById('detailOverlay').innerHTML = '';
}

function showNameOverlay(){
  document.getElementById('nameOverlay').style.display = 'flex';
  document.getElementById('nameInput').focus();
}
function updateWhoami(){
  document.getElementById('whoami').textContent = voterName ? `👤 ${voterName}` : '設定名字';
}

document.getElementById('nameSubmit').addEventListener('click', () => {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) return;
  voterName = val;
  localStorage.setItem('voter_name', voterName);
  document.getElementById('nameOverlay').style.display = 'none';
  updateWhoami();
  render();
});
document.getElementById('whoami').addEventListener('click', showNameOverlay);

function openAddForm(){
  if (!voterName) { showNameOverlay(); return; }
  const overlay = document.getElementById('addOverlay');
  const categoryOptions = CATEGORY_ORDER.map(c => `<option value="${c}">${CATEGORY_META[c].label}</option>`).join('');
  overlay.innerHTML = `
    <div class="detail-overlay">
      <div class="detail-sheet">
        <div class="detail-top" style="background:var(--ink)"></div>
        <div class="detail-head">
          <div><h2>新增地點</h2></div>
          <button class="detail-close" id="addClose">✕</button>
        </div>
        <div class="detail-body">
          <div class="form-group">
            <label>分類</label>
            <select id="f_cat">${categoryOptions}</select>
          </div>
          <div class="form-group">
            <label>名稱 *</label>
            <input id="f_name" type="text" placeholder="例如：XX 咖啡廳">
          </div>
          <div class="form-group">
            <label>介紹</label>
            <textarea id="f_intro" placeholder="推薦什麼、氣氛如何..."></textarea>
          </div>
          <div class="form-group">
            <label>地區</label>
            <input id="f_area" type="text" placeholder="例如：江南區">
          </div>
          <div class="form-group">
            <label>地址</label>
            <input id="f_addr" type="text" placeholder="方便之後開地圖導航">
          </div>
          <div class="form-group">
            <label>來源連結（IG／Threads／部落格）</label>
            <input id="f_link" type="text" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>誰找的</label>
            <input id="f_by" type="text" value="${voterName}">
          </div>
          <div class="form-error" id="f_error" style="display:none;"></div>
          <button class="form-submit" id="f_submit">新增地點</button>
        </div>
      </div>
    </div>
  `;
  overlay.querySelector('.detail-overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('detail-overlay')) closeAddForm();
  });
  overlay.querySelector('#addClose').addEventListener('click', closeAddForm);
  overlay.querySelector('#f_submit').addEventListener('click', submitNewPlace);
}

function closeAddForm(){
  document.getElementById('addOverlay').innerHTML = '';
}

async function submitNewPlace(){
  const name = document.getElementById('f_name').value.trim();
  const errBox = document.getElementById('f_error');
  if (!name){
    errBox.textContent = '請至少填名稱';
    errBox.style.display = 'block';
    return;
  }
  const btn = document.getElementById('f_submit');
  btn.disabled = true;
  btn.textContent = '新增中...';

  const payload = {
    分類: document.getElementById('f_cat').value,
    名稱: name,
    介紹: document.getElementById('f_intro').value.trim() || null,
    地區: document.getElementById('f_area').value.trim() || null,
    地址: document.getElementById('f_addr').value.trim() || null,
    來源連結: document.getElementById('f_link').value.trim() || null,
    加入者: document.getElementById('f_by').value.trim() || voterName,
  };

  try {
    const { error } = await sb.from('places').insert(payload);
    if (error) throw error;
    closeAddForm();
    await loadData();
    // 自動展開新地點所在的分類
    const cat = CATEGORY_ALIAS[payload.分類] || payload.分類;
    openCategories.add(cat);
    render();
  } catch (e) {
    console.error(e);
    errBox.textContent = '新增失敗，請再試一次';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '新增地點';
  }
}

document.getElementById('fabAdd').addEventListener('click', openAddForm);

// 啟動
updateWhoami();
if (!voterName) showNameOverlay();
loadData();
</script>

</body>
</html>
