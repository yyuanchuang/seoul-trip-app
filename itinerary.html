<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首爾行程表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F3EEE4;
    --card:#FFFFFF;
    --ink:#1C1B1A;
    --ink-soft:#6B6560;
    --line:#E4DDCF;

    --coffee:#00A650; --l2:#00A650;
    --food:#FF7E00;   --l3:#FF7E00;
    --shop:#00A5DE;   --l4:#00A5DE;
    --sight:#0052A4;  --l1:#0052A4;
    --med:#A0498B;    --plum:#A0498B;
    --l6:#CD7C2F; --arex:#0090D2; --alert:#C0392B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation:none !important; transition:none !important;}
  }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:70px;
  }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes sheetUp{ from{opacity:0; transform:translateY(28px);} to{opacity:1; transform:translateY(0);} }
  @keyframes backdropIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes pulseSoft{ 0%,100%{opacity:.35;} 50%{opacity:.85;} }
  @keyframes lockIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ 0%{transform:scale(.9); opacity:0;} 100%{transform:scale(1); opacity:1;} }

  nav.topnav{
    display:flex; gap:0; background:var(--card); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  nav.topnav a{
    flex:1; text-align:center; padding:13px 0; font-size:12.5px; font-weight:700;
    text-decoration:none; color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  nav.topnav a.active{ color:var(--ink); border-bottom-color:var(--ink); }

  header{
    padding:20px 20px 16px;
    background:var(--paper);
  }
  header .eyebrow{
    font-size:12px; letter-spacing:0.14em; color:var(--ink-soft); font-weight:700; text-transform:uppercase;
  }
  header h1{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size:24px; margin:4px 0 2px;
  }

  .daytabs{
    display:flex; gap:6px; padding:0 16px 16px; overflow-x:auto;
  }
  .daytab{
    flex:none; padding:10px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    white-space:nowrap; transition:transform .12s ease, background .18s ease, color .18s ease, border-color .18s ease;
  }
  .daytab .d{ display:block; font-size:11px; font-weight:400; }
  .daytab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .daytab:active{ transform:scale(.95); }

  .list{ padding:4px 16px 100px; display:flex; flex-direction:column; gap:6px; }

  .navcta{ padding:0 16px 14px; }
  .navcta a{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; border-radius:16px;
    background:linear-gradient(135deg, rgba(255,255,255,0.68) 0%, rgba(215,232,250,0.5) 100%);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    backdrop-filter:blur(14px) saturate(180%);
    border:1px solid rgba(255,255,255,0.75);
    color:var(--ink); font-weight:700; font-size:14px; text-decoration:none;
    box-sizing:border-box;
    box-shadow:0 8px 22px rgba(0,82,164,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
    position:relative; overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .navcta a::before{
    content:''; position:absolute; inset:0; border-radius:16px;
    background:linear-gradient(120deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 45%);
    pointer-events:none;
  }
  .navcta a span{ position:relative; z-index:1; }
  .navcta a:active{ transform:scale(.98); box-shadow:0 4px 12px rgba(0,82,164,0.1), inset 0 1px 0 rgba(255,255,255,0.9); }

  .leg{
    display:flex; align-items:center; justify-content:center;
    position:relative; min-height:30px; padding:2px 0;
  }
  .leg::before{
    content:''; position:absolute; left:50%; top:0; bottom:0;
    border-left:2px dashed var(--line);
  }
  .leg .pill{
    position:relative; z-index:1; background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:700;
    color:var(--ink-soft); display:flex; align-items:center; gap:5px;
    animation:fadeUp .3s ease both;
  }
  .leg .pill .dur{ color:var(--ink-soft); font-weight:400; opacity:.75; }
  .leg .pill.empty{ font-weight:400; opacity:.6; }

  .flightcard{
    margin:4px 0 2px; border-radius:16px; padding:16px 18px;
    background:#EAF1FA; border:1px solid #C9DDF2;
    color:var(--ink);
    animation:fadeUp .35s ease both;
  }
  .fc-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .fc-pt{ text-align:center; flex:1; min-width:0; }
  .fc-time{ font-family:'Noto Serif TC',serif; font-size:26px; font-weight:900; line-height:1.15; color:var(--l1); }
  .fc-place{
    font-size:11px; color:var(--ink-soft); margin-top:3px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .fc-mid{ flex:none; text-align:center; padding:0 8px; }
  .fc-flightno{ font-size:10px; font-weight:700; margin-bottom:4px; white-space:nowrap; color:var(--ink-soft); }
  .fc-durrow{ display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:4px; }
  .fc-plane{ font-size:15px; }
  .fc-duration{ font-size:13px; font-weight:700; color:var(--l1); white-space:nowrap; }
  .fc-line{ width:52px; height:2px; background:var(--l1); opacity:.4; position:relative; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px;
  }

  .item{
    background:var(--card); border-radius:16px; padding:14px 14px 14px 0;
    display:flex; align-items:stretch; gap:10px; border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(28,27,26,0.04);
    animation:fadeUp .38s ease both;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .item.current{
    border-color:var(--l4); border-width:2px; padding:13px 13px 13px 0;
    box-shadow:0 3px 12px rgba(0,165,222,0.18);
  }
  .badge-row{ display:flex; gap:6px; margin-bottom:4px; }
  .badge{
    font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px;
    display:inline-block;
  }
  .badge-current{ background:var(--l4); color:#fff; }
  .badge-next{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }

  .nownav{ padding:0 16px 10px; }
  .nownav button{
    width:100%; padding:10px; border-radius:12px; border:1px dashed var(--l4);
    background:#EAF8FD; color:var(--l4); font-weight:700; font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .12s ease;
  }
  .nownav button:active{ transform:scale(.97); }
  .list .item:nth-child(1){animation-delay:.02s} .list .item:nth-child(2){animation-delay:.06s}
  .list .item:nth-child(3){animation-delay:.1s} .list .item:nth-child(4){animation-delay:.14s}
  .list .item:nth-child(5){animation-delay:.18s} .list .item:nth-child(n+6){animation-delay:.22s}
  .item .stripe{ width:4px; border-radius:4px; flex:none; }
  .item .timecol{
    flex:none; width:56px; display:flex; flex-direction:column; align-items:center;
    padding-top:2px; gap:6px;
  }
  .item .timecol .t{
    font-family:'Noto Serif TC',serif; font-weight:900; font-size:18px; color:var(--ink);
    line-height:1.15; text-align:center;
  }
  .item .reorder{
    display:flex; flex-direction:column; gap:4px; flex:none;
  }
  .item .reorder button{
    width:24px; height:20px; border-radius:6px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink-soft); font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, background .15s ease;
  }
  .item .reorder button:active{ transform:scale(.88); background:var(--card); }
  .item .reorder button:disabled{ opacity:0.3; }
  .item-body{ flex:1; min-width:0; }
  .item-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .item-body .name{ font-weight:700; font-size:15px; margin:0 0 4px; }
  .item-meta{ display:flex; flex-wrap:wrap; gap:6px; font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; }
  .item-meta span{ display:inline-flex; align-items:center; gap:3px; }

  .tip{
    background:#FBF3DE; border:1px solid #EEDFB0; border-radius:10px;
    padding:9px 11px; margin-bottom:10px; font-size:12.5px; line-height:1.65; color:#6B5A2A;
    display:flex; gap:7px; align-items:flex-start;
  }
  .tip .ic{ flex:none; font-size:13px; }
  .item-actions{ display:flex; gap:8px; }
  .item-actions button, .item-actions a{
    font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); text-decoration:none; cursor:pointer;
    transition:transform .12s ease;
  }
  .item-actions button:active, .item-actions a:active{ transform:scale(.94); }
  .item-actions .danger{ color:#C0392B; border-color:#EAD3CF; background:#FBF2F0; }

  .fab{
    position:fixed; right:20px; bottom:24px; z-index:150;
    width:56px; height:56px; border-radius:999px; border:none;
    background:var(--ink); color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(28,27,26,0.3); cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .fab:active{ transform:scale(.9); }

  .detail-overlay{
    position:fixed; inset:0; background:rgba(28,27,26,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:200;
    animation:backdropIn .18s ease both;
  }
  .detail-sheet{
    background:var(--paper); border-radius:20px 20px 0 0;
    max-width:480px; width:100%; max-height:85vh; overflow-y:auto;
    padding:0 0 24px;
    animation:sheetUp .32s cubic-bezier(.22,1,.36,1) both;
  }
  .detail-top{ height:6px; border-radius:20px 20px 0 0; }
  .detail-head{
    padding:20px 20px 12px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .detail-head h2{ font-family:'Noto Serif TC', serif; font-size:19px; font-weight:900; margin:0; }
  .detail-close{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    width:30px; height:30px; flex:none; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
    transition:transform .12s ease;
  }
  .detail-close:active{ transform:scale(.88); }
  .detail-body{ padding:0 20px; }

  .cat-group{ margin-bottom:18px; }
  .cat-group h3{
    font-family:'Noto Serif TC', serif; font-size:14px; margin:0 0 8px; display:flex; align-items:center; gap:8px;
  }
  .cat-dot{ width:10px; height:10px; border-radius:999px; flex:none; }
  .pick-item{
    padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    margin-bottom:6px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; align-items:center;
    transition:transform .1s ease, background .15s ease;
  }
  .pick-item:active{ transform:scale(.97); background:var(--paper); }
  .pick-item small{ color:var(--ink-soft); font-weight:400; }
  .pick-item.added{ opacity:0.4; pointer-events:none; }

  .form-group{ margin-bottom:14px; }
  .form-group label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  .form-group input, .form-group textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:14px; font-family:'Noto Sans TC', sans-serif; box-sizing:border-box; background:#fff; color:var(--ink);
  }
  .form-submit{
    width:100%; padding:12px; border-radius:12px; border:none;
    background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-top:4px;
    transition:transform .12s ease;
  }
  .form-submit:active{ transform:scale(.97); }

  .loading{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13px; animation:pulseSoft 1.6s ease-in-out infinite; }
</style>
</head>

  <div style="max-width:300px;width:100%;text-align:center;">
    <div style="font-family:'Noto Serif TC',serif;font-weight:900;font-size:19px;margin-bottom:5px;color:var(--ink);">首爾家族旅行</div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;">請輸入密碼查看</div>
    <input id="lockInput" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-size:16px;text-align:center;letter-spacing:0.25em;margin-bottom:12px;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:var(--card);">
    <button id="lockBtn" style="width:100%;padding:12px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;">進入</button>
    <div id="lockErr" style="color:#C0392B;font-size:12px;margin-top:10px;display:none;">密碼不對，再試一次</div>
  </div>
</div>
<script>
(function(){
  var PASS = '261021';
  var KEY = 'seoul_trip_unlocked';
  if (localStorage.getItem(KEY) === 'yes') {
    var el = document.getElementById('lockScreen');
    if (el) el.remove();
    return;
  }
  function tryUnlock(){
    var v = document.getElementById('lockInput').value.trim();
    if (v === PASS){
      localStorage.setItem(KEY, 'yes');
      document.getElementById('lockScreen').remove();
    } else {
      document.getElementById('lockErr').style.display = 'block';
      document.getElementById('lockInput').focus();
      document.getElementById('lockInput').select();
    }
  }
  document.getElementById('lockBtn').addEventListener('click', tryUnlock);
  document.getElementById('lockInput').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
  setTimeout(function(){ var i=document.getElementById('lockInput'); if(i) i.focus(); }, 100);
})();
</script>

<script>
const SUPABASE_URL = 'https://vmalwtagpcxvxocsopvi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtYWx3dGFncGN4dnhvY3NvcHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4ODA1NTUsImV4cCI6MjEwMTQ1NjU1NX0.dXmudSH8rMmIYw3g0FgmcunBjsaAmyOULQLa9qWrR74';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORY_META = {
  '咖啡': { color: 'var(--coffee)', label: '咖啡' },
  '美食': { color: 'var(--food)', label: '美食' },
  '購物': { color: 'var(--shop)', label: '購物' },
  '景點': { color: 'var(--sight)', label: '景點' },
  '醫美': { color: 'var(--med)', label: '醫美' },
};
const CATEGORY_ALIAS = {
  '咖啡':'咖啡', '聖水洞':'美食', '弘大美食':'美食',
  '購物':'購物', '景點':'景點', '醫美':'醫美'
};
const CATEGORY_ORDER = ['咖啡','美食','購物','景點','醫美'];

const TRIP_START = new Date('2026-10-21');
const DAY_COUNT = 5;
const WEEKDAYS = ['日','一','二','三','四','五','六'];

let currentDay = 1;
let places = [];
let itinerary = [];

// 韓國固定用 UTC+9 計算，不管看的人手機時區在哪，結果都一致
function tripDayNumber(){
  const day1StartMs = TRIP_START.getTime() - 9 * 3600000; // 10/21 00:00 KST
  return Math.floor((Date.now() - day1StartMs) / 86400000) + 1;
}
function kstMinutesNow(){
  const kstMs = Date.now() + 9 * 3600000;
  const d = new Date(kstMs);
  return d.getUTCHours() * 60 + d.getUTCMinutes();
}
function timeToMinutes(hhmm){
  const m = /^(\d{1,2}):(\d{2})/.exec((hhmm || '').trim());
  if (!m) return null;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

function dayLabel(dayNum){
  const d = new Date(TRIP_START);
  d.setDate(d.getDate() + (dayNum - 1));
  return { m: d.getMonth()+1, day: d.getDate(), w: WEEKDAYS[d.getDay()] };
}

function mapSearchQuery(p){
  return encodeURIComponent(`${p?.名稱 || ''} ${p?.地址 || ''}`.trim());
}

let didInitialJump = false;

async function loadData(){
  const listEl = document.getElementById('list');
  try {
    const [{ data: placesData, error: pErr }, { data: itinData, error: iErr }] = await Promise.all([
      sb.from('places').select('*'),
      sb.from('itinerary').select('*, places(*)').order('day').order('sort_order'),
    ]);
    if (pErr) throw pErr;
    if (iErr) throw iErr;
    places = placesData || [];
    itinerary = itinData || [];

    if (!didInitialJump){
      didInitialJump = true;
      const real = tripDayNumber();
      if (real >= 1 && real <= DAY_COUNT) currentDay = real;
    }

    renderDayTabs();
    renderList();
    renderDayNav();
    renderNowNav();
  } catch (e) {
    console.error(e);
    listEl.innerHTML = `<div class="empty-state">載入失敗：${e.message || '請稍後再試'}</div>`;
  }
}

function renderNowNav(){
  const wrap = document.getElementById('nowNav');
  const real = tripDayNumber();
  if (real < 1 || real > DAY_COUNT){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<div class="nownav"><button id="jumpNow">📍 回到目前行程（Day ${real}）</button></div>`;
  document.getElementById('jumpNow').addEventListener('click', () => {
    currentDay = real;
    renderDayTabs();
    renderList();
    renderDayNav();
    setTimeout(() => {
      const items = itemsForDay(real);
      const nowMin = kstMinutesNow();
      let idx = -1;
      items.forEach((it, i) => { const t = timeToMinutes(it.arrival_time); if (t !== null && t <= nowMin) idx = i; });
      const target = items[idx > -1 ? idx : 0];
      if (target){
        const el = document.querySelector(`[data-itin-id="${target.id}"]`);
        if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
      }
    }, 60);
  });
}

function renderDayTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  for (let d = 1; d <= DAY_COUNT; d++){
    const info = dayLabel(d);
    const btn = document.createElement('button');
    btn.className = 'daytab' + (d === currentDay ? ' active' : '');
    btn.innerHTML = `Day ${d}<span class="d">${info.m}/${info.day} (${info.w})</span>`;
    btn.addEventListener('click', () => { currentDay = d; renderDayTabs(); renderList(); renderDayNav(); });
    wrap.appendChild(btn);
  }
}

function itemsForDay(d){
  return itinerary.filter(i => i.day === d).sort((a,b) => a.sort_order - b.sort_order);
}

function buildDayRouteUrl(items){
  const stops = items
    .map(it => it.places || {})
    .filter(p => p.名稱)
    .map(p => mapSearchQuery(p));
  if (stops.length < 2) return null;
  const origin = stops[0];
  const destination = stops[stops.length - 1];
  const waypoints = stops.slice(1, -1);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
  if (waypoints.length) url += `&waypoints=${waypoints.join('|')}`;
  return url;
}

function renderDayNav(){
  const wrap = document.getElementById('dayNav');
  const items = itemsForDay(currentDay);
  const url = buildDayRouteUrl(items);
  if (!url){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <div class="navcta">
      <a href="${url}" target="_blank" rel="noopener"><span>🧭 開啟今天整條導航路線</span></a>
    </div>
  `;
}

function renderList(){
  const listEl = document.getElementById('list');
  const items = itemsForDay(currentDay);
  if (!items.length){
    listEl.innerHTML = `<div class="empty-state">這天還沒排行程，點右下角「＋」加入地點</div>`;
    return;
  }

  // 只在「今天真的是這一天」時才判斷目前站/下一站
  let currentIdx = -1, nextIdx = -1;
  if (tripDayNumber() === currentDay){
    const nowMin = kstMinutesNow();
    items.forEach((it, i) => {
      const t = timeToMinutes(it.arrival_time);
      if (t !== null && t <= nowMin) currentIdx = i;
    });
    if (currentIdx > -1 && currentIdx < items.length - 1) nextIdx = currentIdx + 1;
    if (currentIdx === -1 && items.some(it => timeToMinutes(it.arrival_time) !== null)) nextIdx = 0;
  }

  listEl.innerHTML = '';
  items.forEach((it, idx) => {
    const p = it.places || {};
    const cat = CATEGORY_ALIAS[p.分類] || p.分類;
    const meta = CATEGORY_META[cat] || { color: 'var(--ink-soft)', label: cat || '' };
    const q = mapSearchQuery(p);

    if (idx > 0) {
      const prevItem = items[idx - 1];
      const transportText = it.transport || '';
      const flightMatch = transportText.match(/([A-Z]{2}\d{3,4})/);
      const isFlight = flightMatch && /班機/.test(transportText);

      if (isFlight) {
        const fromP = prevItem.places || {};
        const depMatch = (prevItem.notes || '').match(/(\d{1,2}:\d{2})\s*起飛/);
        const depTime = depMatch ? depMatch[1] : '';
        const arrTime = it.arrival_time || '';

        let durationLabel = '';
        if (depTime && arrTime) {
          const [dh, dm] = depTime.split(':').map(Number);
          const [ah, am] = arrTime.split(':').map(Number);
          let mins = (ah * 60 + am) - (dh * 60 + dm);
          if (mins < 0) mins += 24 * 60; // 跨夜
          const h = Math.floor(mins / 60), m = mins % 60;
          durationLabel = h > 0 ? `${h}小時${m > 0 ? m + '分' : ''}` : `${m}分`;
        }

        const leg = document.createElement('div');
        leg.className = 'flightcard';
        leg.innerHTML = `
          <div class="fc-row">
            <div class="fc-pt">
              ${depTime ? `<div class="fc-time">${depTime}</div>` : ''}
              <div class="fc-place">${fromP.名稱 || ''}</div>
            </div>
            <div class="fc-mid">
              <div class="fc-flightno">${flightMatch[1]}</div>
              <div class="fc-durrow">
                <span class="fc-plane">✈️</span>
                ${durationLabel ? `<span class="fc-duration">${durationLabel}</span>` : ''}
              </div>
              <div class="fc-line"></div>
            </div>
            <div class="fc-pt">
              ${arrTime ? `<div class="fc-time">${arrTime}</div>` : ''}
              <div class="fc-place">${p.名稱 || ''}</div>
            </div>
          </div>
        `;
        listEl.appendChild(leg);
      } else {
        const leg = document.createElement('div');
        leg.className = 'leg';
        if (it.transport) {
          const parts = it.transport.split(/[｜|]/).map(s => s.trim()).filter(Boolean);
          const method = parts[0] || '';
          const dur = parts[1] || '';
          leg.innerHTML = `<span class="pill">🚉 ${method}${dur ? `<span class="dur">｜${dur}</span>` : ''}</span>`;
        } else {
          leg.innerHTML = `<span class="pill empty">交通方式未填</span>`;
        }
        listEl.appendChild(leg);
      }
    }

    const isCurrent = idx === currentIdx;
    const isNext = idx === nextIdx;

    const row = document.createElement('div');
    row.className = 'item' + (isCurrent ? ' current' : '');
    row.dataset.itinId = it.id;
    row.innerHTML = `
      <div class="stripe" style="background:${meta.color}"></div>
      <div class="timecol">
        ${it.arrival_time ? `<div class="t">${it.arrival_time}</div>` : ''}
        <div class="reorder">
          <button class="up" ${idx === 0 ? 'disabled' : ''}>▲</button>
          <button class="down" ${idx === items.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
      </div>
      <div class="item-body">
        <div class="item-top">
          <p class="name">${p.名稱 || '（地點已刪除）'}</p>
        </div>
        ${isCurrent || isNext ? `<div class="badge-row">${isCurrent ? `<span class="badge badge-current">目前行程</span>` : `<span class="badge badge-next">下一站</span>`}</div>` : ''}
        ${it.duration ? `<div class="item-meta"><span>⏱ 停留 ${it.duration}</span></div>` : ''}
        ${it.notes ? `<div class="tip"><span class="ic">💡</span><span>${it.notes}</span></div>` : ''}
        <div class="item-actions">
          <button class="editBtn">編輯</button>
          <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google地圖</a>
          <a href="https://map.naver.com/v5/search/${q}" target="_blank" rel="noopener">Naver地圖</a>
          <button class="danger removeBtn">移除</button>
        </div>
      </div>
    `;
    row.querySelector('.up').addEventListener('click', () => reorder(it, items[idx-1]));
    row.querySelector('.down').addEventListener('click', () => reorder(it, items[idx+1]));
    row.querySelector('.editBtn').addEventListener('click', () => openEdit(it, p, meta));
    row.querySelector('.removeBtn').addEventListener('click', () => removeItem(it.id));
    listEl.appendChild(row);
  });
}

async function reorder(a, b){
  if (!b) return;
  try {
    await Promise.all([
      sb.from('itinerary').update({ sort_order: b.sort_order }).eq('id', a.id),
      sb.from('itinerary').update({ sort_order: a.sort_order }).eq('id', b.id),
    ]);
    await loadData();
  } catch (e) {
    console.error(e);
    alert('排序失敗，請再試一次');
  }
}

async function removeItem(id){
  if (!confirm('確定要從行程移除這個地點嗎？')) return;
  try {
    const { error } = await sb.from('itinerary').delete().eq('id', id);
    if (error) throw error;
    await loadData();
  } catch (e) {
    console.error(e);
    alert('移除失敗，請再試一次');
  }
}

function openEdit(it, p, meta){
  const overlay = document.getElementById('editOverlay');
  overlay.innerHTML = `
    <div class="detail-overlay">
      <div class="detail-sheet">
        <div class="detail-top" style="background:${meta.color}"></div>
        <div class="detail-head">
          <h2>${p.名稱 || ''}</h2>
          <button class="detail-close" id="editClose">✕</button>
        </div>
        <div class="detail-body">
          <div class="form-group">
            <label>預計到達時間</label>
            <input id="e_arrival" type="text" placeholder="例如：14:00" value="${it.arrival_time || ''}">
          </div>
          <div class="form-group">
            <label>預計停留時間</label>
            <input id="e_duration" type="text" placeholder="例如：1.5 小時" value="${it.duration || ''}">
          </div>
          <div class="form-group">
            <label>交通方式（從上一站怎麼過來）</label>
            <input id="e_transport" type="text" placeholder="例如：包車接送｜1小時 / 步行｜10分鐘" value="${it.transport || ''}">
          </div>
          <div class="form-group">
            <label>小提醒（會顯示成提示框）</label>
            <textarea id="e_notes" placeholder="例如：入口有廁所、記得先買門票、退潮時招潮蟹最多">${it.notes || ''}</textarea>
          </div>
          <button class="form-submit" id="e_save">儲存</button>
        </div>
      </div>
    </div>
  `;
  overlay.querySelector('.detail-overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('detail-overlay')) closeEdit();
  });
  overlay.querySelector('#editClose').addEventListener('click', closeEdit);
  overlay.querySelector('#e_save').addEventListener('click', async () => {
    const btn = overlay.querySelector('#e_save');
    btn.disabled = true; btn.textContent = '儲存中...';
    try {
      const { error } = await sb.from('itinerary').update({
        arrival_time: document.getElementById('e_arrival').value.trim() || null,
        duration: document.getElementById('e_duration').value.trim() || null,
        transport: document.getElementById('e_transport').value.trim() || null,
        notes: document.getElementById('e_notes').value.trim() || null,
      }).eq('id', it.id);
      if (error) throw error;
      closeEdit();
      await loadData();
    } catch (e) {
      console.error(e);
      alert('儲存失敗，請再試一次');
      btn.disabled = false; btn.textContent = '儲存';
    }
  });
}
function closeEdit(){ document.getElementById('editOverlay').innerHTML = ''; }

function openPicker(){
  const overlay = document.getElementById('pickOverlay');
  const addedIds = new Set(itemsForDay(currentDay).map(i => i.place_id));
  let html = `
    <div class="detail-overlay">
      <div class="detail-sheet">
        <div class="detail-top" style="background:var(--ink)"></div>
        <div class="detail-head">
          <h2>加入 Day ${currentDay}</h2>
          <button class="detail-close" id="pickClose">✕</button>
        </div>
        <div class="detail-body">
  `;
  CATEGORY_ORDER.forEach(cat => {
    const meta = CATEGORY_META[cat];
    const items = places.filter(p => (CATEGORY_ALIAS[p.分類] || p.分類) === cat);
    if (!items.length) return;
    html += `<div class="cat-group"><h3><span class="cat-dot" style="background:${meta.color}"></span>${meta.label}</h3>`;
    items.forEach(p => {
      const already = addedIds.has(p.id);
      html += `<div class="pick-item ${already ? 'added' : ''}" data-id="${p.id}">
        <span>${p.名稱}${p.地區 ? ` <small>· ${p.地區}</small>` : ''}</span>
        <span>${already ? '已加入' : '+'}</span>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div></div></div>`;
  overlay.innerHTML = html;

  overlay.querySelector('.detail-overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('detail-overlay')) closePicker();
  });
  overlay.querySelector('#pickClose').addEventListener('click', closePicker);
  overlay.querySelectorAll('.pick-item:not(.added)').forEach(el => {
    el.addEventListener('click', () => addToItinerary(parseInt(el.dataset.id)));
  });
}
function closePicker(){ document.getElementById('pickOverlay').innerHTML = ''; }

async function addToItinerary(placeId){
  const existing = itemsForDay(currentDay);
  const nextOrder = existing.length ? Math.max(...existing.map(i => i.sort_order)) + 1 : 0;
  try {
    const { error } = await sb.from('itinerary').insert({
      place_id: placeId, day: currentDay, sort_order: nextOrder,
    });
    if (error) throw error;
    closePicker();
    await loadData();
  } catch (e) {
    console.error(e);
    alert('加入失敗，請再試一次');
  }
}

document.getElementById('fabAdd').addEventListener('click', openPicker);

loadData();
</script>

</body>
</html>
